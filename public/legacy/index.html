<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W9 Bet Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <a href="/" class="site-logo">W9 Bet Game</a>
  </header>

  <main id="main-content" class="page" role="main">
    <div class="main-grid">
      <section aria-label="Product details">
        <div class="hero-row">
          <div class="hero-content">
            <h1 class="content-title">House of Fun™ – Casino Slots</h1>
            <div class="actions-row">
              <a href="#install" class="btn-primary">Install</a>
            </div>
          </div>
          <div class="hero-icon-wrap">
            <img src="https://picsum.photos/seed/appicon/192/192" alt="App icon" width="192" height="192" class="app-icon-hero" />
          </div>
        </div>

        <div class="stats-row" role="group" aria-label="Key statistics">
          <div class="stat-card">
            <div class="stat-value">4.2★</div>
            <div class="stat-label">1.61M reviews</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">10M+</div>
            <div class="stat-label">Downloads</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">18+</div>
            <div class="stat-label">Rated for 18+</div>
          </div>
        </div>

        <div class="carousel-section">
          <h2 class="carousel-heading">Screenshots</h2>
          <div class="carousel-track" role="region" aria-label="App screenshots">
            <div class="carousel-item"><img src="https://picsum.photos/seed/screen1/180/320" alt="Screenshot 1" width="180" height="320" loading="lazy" decoding="async" /></div>
            <div class="carousel-item"><img src="https://picsum.photos/seed/screen2/180/320" alt="Screenshot 2" width="180" height="320" loading="lazy" decoding="async" /></div>
            <div class="carousel-item"><img src="https://picsum.photos/seed/screen3/180/320" alt="Screenshot 3" width="180" height="320" loading="lazy" decoding="async" /></div>
            <div class="carousel-item"><img src="https://picsum.photos/seed/screen4/180/320" alt="Screenshot 4" width="180" height="320" loading="lazy" decoding="async" /></div>
            <div class="carousel-item"><img src="https://picsum.photos/seed/screen5/180/320" alt="Screenshot 5" width="180" height="320" loading="lazy" decoding="async" /></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
